<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6e6e">
<title>Sprint · Grundaufgaben</title>
<style>
/* VOICE everyday, for 10–13-year-olds: calm, big, no clutter
   IDEA a pocket calculator: display on top, large keypad at the thumb
   PICTURE the problem itself, huge, above a 12-key pad
   COLOUR deep teal frame, white display, coral only for "wrong", green-teal for "right"
   TYPE system UI font, tabular figures
   LAYOUT phone: problem top half, keypad bottom half; desktop: same, centred column of 480px */
:root{color-scheme:light dark;--bg:light-dark(#f4f8f7,#0b1413);--card:light-dark(#ffffff,#132120);--ink:light-dark(#12201f,#e8f1ef);--muted:light-dark(#5b6b69,#9fb2af);--line:light-dark(#d6e2e0,#253633);--teal:#0f6e6e;--teal2:light-dark(#e1f1ef,#16302d);--coral:light-dark(#d9452f,#ff7a63);--coral2:light-dark(#fde9e5,#3a1f1a);--key:light-dark(#ffffff,#1a2b29);--keyd:light-dark(#e7efed,#22383a)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation;overscroll-behavior:none}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.top{background:var(--teal);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top b{font-size:18px}
.top small{opacity:.85}
.body{flex:1;overflow:auto;padding:18px}
h1{font-size:28px;line-height:1.1;margin:0 0 6px}
h2{font-size:20px;margin:18px 0 8px}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.big{display:block;width:100%;min-height:64px;border:0;border-radius:14px;background:var(--teal);color:#fff;font:600 20px system-ui,sans-serif;margin:10px 0;cursor:pointer}
.big.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;padding:10px;min-height:44px;cursor:pointer}
input[type=text]{width:100%;font-size:20px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-height:52px;text-transform:uppercase}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
.fig{display:flex;gap:18px;flex-wrap:wrap}
.fig div b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.fig div span{font-size:13px;color:var(--muted)}
.set{font-weight:700;color:var(--teal)}
/* Rechenbereich */
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:12px 18px;gap:10px;position:relative}
.timer{position:absolute;top:0;left:0;right:0;height:8px;background:var(--keyd)}
.timer i{display:block;height:100%;background:var(--teal);transform-origin:left;width:100%}
.secs{position:absolute;top:14px;right:18px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
.prob{font-size:clamp(44px,13vw,64px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.ans{min-width:3.2ch;border-bottom:4px solid var(--teal);display:inline-block;text-align:center;color:var(--teal)}
.ans.empty::after{content:"";display:inline-block;width:3px;height:.9em;background:var(--teal);vertical-align:-.1em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.flash-ok{animation:ok .35s}.flash-bad{animation:bad .4s}
@keyframes ok{0%{background:var(--teal2)}100%{background:transparent}}
@keyframes bad{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.note{font-size:15px;color:var(--muted);text-align:center;min-height:1.4em}
.show{font-size:clamp(40px,12vw,58px);font-weight:700;color:var(--teal)}
.bar{height:10px;background:var(--keyd);border-radius:5px;overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:var(--teal)}
/* Tastatur */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px 14px;background:var(--keyd);user-select:none;-webkit-user-select:none}
.pad button{height:clamp(56px,9.5vh,78px);border:0;border-radius:12px;background:var(--key);color:var(--ink);font:600 30px system-ui,sans-serif;box-shadow:0 1px 0 var(--line);touch-action:manipulation;cursor:pointer}
.pad button:active,.pad button.down{transform:translateY(1px);filter:brightness(.92)}
.pad .ok{background:var(--teal);color:#fff;font-size:22px}
.pad .del{font-size:24px}
.target{font-size:clamp(80px,26vw,120px);font-weight:700;color:var(--teal);font-variant-numeric:tabular-nums}
.wrong{list-style:none;padding:0;margin:8px 0;display:flex;flex-wrap:wrap;gap:8px}
.wrong li{background:var(--coral2);color:var(--coral);border-radius:999px;padding:4px 12px;font-weight:600;font-variant-numeric:tabular-nums}
svg text{font:12px system-ui,sans-serif;fill:var(--muted)}
.err{background:var(--coral2);color:var(--coral);border-radius:10px;padding:10px 12px;margin:10px 0}
@media(prefers-reduced-motion:reduce){.ans.empty::after,.flash-ok,.flash-bad{animation:none}}
</style>
</head>
<body>
<div id="app"><div class="body"><p class="muted">Lädt…</p></div></div>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
{
const C = window.SPRINT_CONFIG || {};
const S = window.ST;
const $ = q => document.querySelector(q);
const app = $('#app');
const LS_TOKEN = 'st-token', LS_PENDING = 'st-pending', LS_LOGIN = 'st-login';
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const SPRINT_MS = 60000, TIPP_MS = 30000;

async function rpc(fn, args) {
  const r = await fetch(C.supabaseUrl + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { apikey: C.supabaseAnonKey, Authorization: 'Bearer ' + C.supabaseAnonKey, 'Content-Type': 'application/json' },
    body: JSON.stringify(args)
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

let token = ls.get(LS_TOKEN, null);
let me = null;               // Zustand vom Server
let buf = '';                // Eingabe
let onKey = null;            // aktueller Tasten-Handler
let raf = 0, timers = [];

/* ---------- Tastatur ---------- */
function padHTML(okLabel) {
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'del', '0', 'ok'];
  return '<div class="pad" id="pad">' + keys.map(k =>
    k === 'del' ? '<button data-k="del" class="del" aria-label="Löschen">⌫</button>'
    : k === 'ok' ? '<button data-k="ok" class="ok">' + (okLabel || 'OK') + '</button>'
    : '<button data-k="' + k + '">' + k + '</button>').join('') + '</div>';
}
app.addEventListener('pointerdown', e => {
  const b = e.target.closest('.pad button'); if (!b) return;
  e.preventDefault(); b.classList.add('down'); setTimeout(() => b.classList.remove('down'), 90);
  if (onKey) onKey(b.dataset.k);
});
document.addEventListener('keydown', e => {
  if (!onKey || e.target.tagName === 'INPUT') return;
  if (/^[0-9]$/.test(e.key)) onKey(e.key);
  else if (e.key === 'Backspace') onKey('del');
  else if (e.key === 'Enter') onKey('ok');
  else return;
  e.preventDefault();
});
function typeKey(k, max) {
  if (k === 'del') buf = buf.slice(0, -1);
  else if (/^[0-9]$/.test(k) && buf.length < (max || 3)) buf = buf === '0' ? k : buf + k;
}
function stopAll() { cancelAnimationFrame(raf); timers.forEach(clearTimeout); timers = []; onKey = null; }

/* ---------- Offline-Puffer ---------- */
async function save(payload) {
  try {
    const r = await rpc('student_save', Object.assign({ p_token: token }, payload));
    if (r && r.error === 'session') { logout(true); return false; }
    return !!(r && r.ok);
  } catch (e) {
    const q = ls.get(LS_PENDING, []); q.push(payload); ls.set(LS_PENDING, q.slice(-30)); return false;
  }
}
async function flushPending() {
  const q = ls.get(LS_PENDING, []); if (!q.length) return;
  const rest = [];
  for (const p of q) { try { const r = await rpc('student_save', Object.assign({ p_token: token }, p)); if (!(r && r.ok)) rest.push(p); } catch (e) { rest.push(p); } }
  ls.set(LS_PENDING, rest);
}

/* ---------- Login ---------- */
function hashLogin() {
  const h = new URLSearchParams(location.hash.slice(1));
  return h.get('k') ? { k: h.get('k').toUpperCase(), c: h.get('c') || '' } : null;
}
function viewLogin(msg) {
  stopAll();
  const pre = hashLogin() || ls.get(LS_LOGIN, null) || { k: '', c: '' };
  let fixed = !!(pre.k && pre.c);
  buf = '';
  const draw = () => {
    app.innerHTML = `<div class="top"><b>Sprint · Anmelden</b></div>
    <div class="body">
      ${msg ? `<div class="err">${S.esc(msg)}</div>` : ''}
      ${fixed ? `<div class="card"><div class="muted">Klasse</div><b style="font-size:22px">${S.esc(pre.k)}</b><div class="muted" style="margin-top:6px">Kürzel</div><b style="font-size:22px">${S.esc(pre.c)}</b><br><button class="link" id="chg">ändern</button></div>`
      : `<label for="k">Klassencode</label><input type="text" id="k" value="${S.esc(pre.k)}" maxlength="6" autocomplete="off" autocapitalize="characters">
         <label for="c">Kürzel</label><input type="text" id="c" value="${S.esc(pre.c)}" maxlength="12" autocomplete="off">`}
      <label>PIN</label>
      <div class="prob" style="font-size:40px;text-align:center;letter-spacing:.3em" id="pin">${'•'.repeat(buf.length) || '<span class="muted" style="font-size:20px;letter-spacing:0">PIN eintippen</span>'}</div>
    </div>${padHTML('Los')}`;
    const chg = $('#chg'); if (chg) chg.onclick = () => { fixed = false; draw(); };
  };
  draw();
  onKey = async k => {
    if (k !== 'ok') { typeKey(k, 8); $('#pin').innerHTML = '•'.repeat(buf.length) || '<span class="muted" style="font-size:20px;letter-spacing:0">PIN eintippen</span>'; return; }
    const kk = fixed ? pre.k : ($('#k').value || '').trim().toUpperCase();
    const cc = fixed ? pre.c : ($('#c').value || '').trim();
    if (!kk || !cc || buf.length < 4) { msg = 'Bitte Klassencode, Kürzel und PIN eingeben.'; return draw(); }
    onKey = null;
    try {
      const r = await rpc('student_login', { p_join: kk, p_code: cc, p_pin: buf });
      if (r.token) { token = r.token; ls.set(LS_TOKEN, token); ls.set(LS_LOGIN, { k: kk, c: cc }); if (location.hash) history.replaceState(null, '', location.pathname); return start(); }
      msg = r.error === 'locked' ? 'Zu viele Fehlversuche. Warte 15 Minuten.' : r.error === 'no_pin' ? 'Für dich ist noch keine PIN angelegt. Frag deine Lehrkraft.' : 'Das hat nicht geklappt. Prüfe Klassencode, Kürzel und PIN.';
    } catch (e) { msg = 'Keine Verbindung. Bitte später noch einmal.'; }
    buf = ''; pre.k = kk; pre.c = cc; viewLogin(msg);
  };
}
async function logout(expired) {
  if (!expired && token) { try { await rpc('student_logout', { p_token: token }); } catch (e) {} }
  token = null; ls.del(LS_TOKEN); viewLogin(expired ? 'Bitte melde dich neu an.' : '');
}

/* ---------- Start ---------- */
async function start() {
  stopAll();
  if (!C.supabaseUrl) { app.innerHTML = '<div class="body"><div class="err">config.js fehlt oder ist leer.</div></div>'; return; }
  if (!token) return viewLogin();
  app.innerHTML = '<div class="top"><b>Sprint</b></div><div class="body"><p class="muted">Lädt…</p></div>';
  try {
    await flushPending();
    const r = await rpc('student_state', { p_token: token });
    if (r && r.error === 'session') return logout(true);
    me = r;
  } catch (e) {
    if (!me) { app.innerHTML = '<div class="top"><b>Sprint</b></div><div class="body"><div class="err">Keine Verbindung zum Server.</div><button class="big" id="re">Noch einmal</button></div>'; $('#re').onclick = start; return; }
  }
  viewHome();
}

function chart(rows, goal) {
  const W = 420, H = 120, m = 8;
  if (rows.length < 2) return '<p class="muted">Nach zwei Sprints siehst du hier deine Kurve.</p>';
  const mx = Math.max(goal, ...rows.map(r => r.correct)) * 1.15;
  const X = i => m + i * (W - 2 * m) / (rows.length - 1), Y = v => H - m - v / mx * (H - 2 * m);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Deine letzten Sprints">
    <line x1="${m}" x2="${W - m}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--coral)" stroke-dasharray="5 5"/>
    <text x="${W - m}" y="${Y(goal) - 5}" text-anchor="end">Ziel ${goal}</text>
    <polyline fill="none" stroke="var(--teal)" stroke-width="3" points="${rows.map((r, i) => X(i) + ',' + Y(r.correct)).join(' ')}"/>
    ${rows.map((r, i) => `<circle cx="${X(i)}" cy="${Y(r.correct)}" r="3.5" fill="var(--teal)"/>`).join('')}</svg>`;
}

function viewHome(note) {
  stopAll();
  const goal = S.goalApp(me), app_rows = (me.recent || []).filter(r => r.medium === 'app').slice(-15);
  const last = app_rows[app_rows.length - 1], pend = ls.get(LS_PENDING, []).length;
  app.innerHTML = `<div class="top"><div><b>Hallo ${S.esc(me.code)}</b><br><small>${S.esc(me.class)}</small></div><button class="link" id="out" style="color:#fff">Abmelden</button></div>
  <div class="body">
    ${note ? `<div class="card" style="border-color:var(--teal)">${note}</div>` : ''}
    <div class="card">
      <div class="muted">Dein Satz</div>
      <h1><span class="set">${S.esc(me.set)}</span> ${S.esc(S.setName(me.set))}</h1>
      <div class="muted">${S.esc(S.setHint(me.set))}</div>
      <div class="fig" style="margin-top:12px"><div><b>${goal}</b><span>Ziel pro Minute</span></div><div><b>${last ? last.correct : '–'}</b><span>letzter Sprint</span></div><div><b>${app_rows.filter(r => r.d === me.today).length}</b><span>Sprints heute</span></div></div>
    </div>
    ${!me.tap_rate ? '<div class="card"><b>Einmal zuerst: Tipptest (30 Sekunden).</b><br><span class="muted">Damit wird dein Ziel in der App passend zu deinem Tipptempo eingestellt.</span><button class="big" id="tipp">Tipptest starten</button></div>' : ''}
    <button class="big" id="go">Sprint starten · 1 Minute</button>
    <button class="big sec" id="learn">Satz üben · ohne Zeit</button>
    <div class="card"><div class="muted" style="margin-bottom:6px">Deine letzten Sprints in der App</div>${chart(app_rows, goal)}</div>
    ${me.tap_rate ? '<button class="link" id="tipp">Tipptest wiederholen</button>' : ''}
    ${pend ? `<p class="muted">${pend} Ergebnis(se) warten auf die Verbindung und werden später gesendet.</p>` : ''}
  </div>`;
  $('#go').onclick = () => countdown(viewSprint);
  $('#learn').onclick = viewPractice;
  const t = $('#tipp'); if (t) t.onclick = () => countdown(viewTipp);
  $('#out').onclick = () => logout(false);
}

function countdown(next) {
  stopAll();
  let n = 3;
  app.innerHTML = `<div class="stage"><div class="target" id="cd">3</div><div class="note">Mach dich bereit</div></div>`;
  const tick = () => { n--; if (n === 0) return next(); $('#cd').textContent = n; timers.push(setTimeout(tick, 800)); };
  timers.push(setTimeout(tick, 800));
}

/* ---------- Sprint ---------- */
function viewSprint() {
  stopAll();
  let items = S.sprintItems(me.set, 60), i = 0, att = [], shown = 0, cur = null, done = false;
  const t0 = performance.now();
  app.innerHTML = `<div class="stage"><div class="timer"><i id="tb"></i></div><div class="secs" id="secs">60</div>
    <div class="prob" id="prob"></div><div class="note">Weiß nicht? OK drücken und weiter.</div></div>${padHTML()}`;
  const draw = () => { $('#prob').innerHTML = S.esc(cur.t) + ' = <span class="ans' + (buf ? '' : ' empty') + '">' + S.esc(buf) + '</span>'; };
  const next = () => { if (i >= items.length) items = items.concat(S.sprintItems(me.set, 60)); cur = items[i]; buf = ''; shown = performance.now(); draw(); };
  const frame = () => {
    const el = performance.now() - t0, left = Math.max(0, SPRINT_MS - el);
    $('#tb').style.transform = 'scaleX(' + (left / SPRINT_MS) + ')';
    $('#secs').textContent = Math.ceil(left / 1000);
    if (left <= 0) return finish();
    raf = requestAnimationFrame(frame);
  };
  const finish = () => {
    if (done) return; done = true; stopAll();
    const correct = att.filter(a => a.ok).length, errors = att.length - correct;
    const wrong = []; att.forEach(a => { if (!a.ok && !wrong.some(w => w.t === a.f)) { const it = items.find(x => x.t === a.f); if (it) wrong.push(it); } });
    viewResult(correct, errors, wrong, save({ p_mode: 'sprint', p_set: me.set, p_correct: correct, p_errors: errors, p_attempts: att }));
  };
  onKey = k => {
    if (done) return;
    if (k !== 'ok') { typeKey(k, 3); return draw(); }
    const g = buf === '' ? null : +buf;
    att.push({ f: cur.t, s: cur.s, g, ok: g === cur.r, ms: Math.round(performance.now() - shown) });
    i++; next();
  };
  next(); raf = requestAnimationFrame(frame);
}

function viewResult(correct, errors, wrong, saving) {
  const goal = S.goalApp(me), hit = correct >= goal && errors <= 2;
  app.innerHTML = `<div class="top"><b>Ergebnis</b></div><div class="body">
    <div class="card"><div class="fig"><div><b>${correct}</b><span>richtig</span></div><div><b>${errors}</b><span>Fehler und Lücken</span></div><div><b>${goal}</b><span>dein Ziel</span></div></div>
      <div class="bar" style="margin-top:14px"><i style="width:${Math.min(100, correct / goal * 100)}%"></i></div>
      <p style="margin:12px 0 0">${hit ? '<b>Ziel erreicht.</b> Stark!' : correct >= goal ? 'Schnell genug, aber noch zu viele Fehler. Genau zählt mehr als schnell.' : 'Noch ' + (goal - correct) + ' bis zum Ziel. Vergleich dich nur mit dir selbst.'}</p>
      <p class="muted" id="sv" style="margin:6px 0 0">Wird gespeichert…</p></div>
    ${wrong.length ? `<div class="card"><b>Diese Aufgaben reparieren wir jetzt:</b><ul class="wrong">${wrong.map(w => `<li>${S.esc(w.t)} = ${w.r}</li>`).join('')}</ul><button class="big" id="rep">Reparieren</button></div>` : '<div class="card"><b>Keine Fehler.</b></div>'}
    <button class="big sec" id="home">Fertig</button></div>`;
  saving.then(ok => { const el = $('#sv'); if (el) el.textContent = ok ? 'Gespeichert.' : 'Ohne Verbindung: wird später gesendet.'; });
  $('#home').onclick = start;
  const r = $('#rep'); if (r) r.onclick = () => viewRepair(wrong);
}

/* ---------- Reparatur: anschauen, abdecken, eintippen (3×) ---------- */
function viewRepair(list) {
  stopAll();
  let queue = []; list.forEach(f => queue.push({ f, n: 0 }));
  const total = list.length * 3; let doneN = 0;
  const step = () => {
    if (!queue.length) return viewHome('<b>Reparatur geschafft.</b> Diese Aufgaben kommen im nächsten Sprint wieder.');
    const q = queue.shift();
    app.innerHTML = `<div class="stage"><div class="bar"><i style="width:${doneN / total * 100}%"></i></div><div class="note">Anschauen und merken</div><div class="show">${S.esc(q.f.t)} = ${q.f.r}</div></div>${padHTML('Weiter')}`;
    onKey = k => { if (k === 'ok') ask(q); };
    timers.push(setTimeout(() => { if (onKey) ask(q); }, 2200));
  };
  const ask = q => {
    stopAll(); buf = '';
    app.innerHTML = `<div class="stage"><div class="bar"><i style="width:${doneN / total * 100}%"></i></div><div class="note">Jetzt aus dem Kopf</div><div class="prob" id="prob"></div><div class="note" id="fb"></div></div>${padHTML()}`;
    const draw = () => { $('#prob').innerHTML = S.esc(q.f.t) + ' = <span class="ans' + (buf ? '' : ' empty') + '">' + S.esc(buf) + '</span>'; };
    draw();
    onKey = k => {
      if (k !== 'ok') { typeKey(k, 3); return draw(); }
      if (+buf === q.f.r && buf !== '') { q.n++; doneN++; $('#prob').classList.add('flash-ok'); onKey = null; if (q.n < 3) queue.splice(Math.min(1, queue.length), 0, q); timers.push(setTimeout(step, 350)); }
      else { $('#prob').classList.remove('flash-bad'); void $('#prob').offsetWidth; $('#prob').classList.add('flash-bad'); onKey = null; timers.push(setTimeout(() => { queue.unshift(q); step(); }, 450)); }
    };
  };
  step();
}

/* ---------- Üben ohne Zeit ---------- */
function viewPractice() {
  stopAll();
  let pool = S.facts(me.set); if (pool.length > 20) pool = S.shuffle(pool.slice()).slice(0, 20);
  const items = S.shuffle(pool.map(f => ({ f, n: 0 })));
  const total = items.length * 2; let doneN = 0, att = [], shown = 0;
  let queue = items.slice();
  const finish = () => {
    stopAll();
    const ok = att.filter(a => a.ok).length;
    save({ p_mode: 'ueben', p_set: me.set, p_correct: ok, p_errors: att.length - ok, p_attempts: att });
    viewHome('<b>Satz geübt.</b> Jede Aufgabe zweimal richtig und schnell. Jetzt ein Sprint?');
  };
  const askNext = () => {
    if (!queue.length) return finish();
    const q = queue.shift(); buf = ''; shown = performance.now();
    app.innerHTML = `<div class="stage"><div class="bar"><i style="width:${doneN / total * 100}%"></i></div><div class="note"><span class="set">${S.esc(me.set)}</span> üben · <button class="link" id="stop" style="padding:0;min-height:0">beenden</button></div><div class="prob" id="prob"></div><div class="note" id="fb"></div></div>${padHTML()}`;
    $('#stop').onclick = finish;
    const draw = () => { $('#prob').innerHTML = S.esc(q.f.t) + ' = <span class="ans' + (buf ? '' : ' empty') + '">' + S.esc(buf) + '</span>'; };
    draw();
    onKey = k => {
      if (k !== 'ok') { typeKey(k, 3); return draw(); }
      const ms = Math.round(performance.now() - shown), g = buf === '' ? null : +buf, right = g === q.f.r;
      att.push({ f: q.f.t, s: q.f.s, g, ok: right, ms });
      if (right && ms < 4000) {
        q.n++; doneN++; onKey = null; $('#prob').classList.add('flash-ok');
        if (q.n < 2) queue.splice(Math.min(queue.length, 3 + Math.floor(Math.random() * 3)), 0, q);
        timers.push(setTimeout(askNext, 300));
      } else {
        onKey = null; doneN -= q.n; q.n = 0;
        $('#fb').innerHTML = right ? 'Richtig, aber noch zu langsam. Merke:' : 'Merke:';
        $('#prob').innerHTML = '<span class="show">' + S.esc(q.f.t) + ' = ' + q.f.r + '</span>';
        queue.splice(Math.min(queue.length, 2), 0, q);
        timers.push(setTimeout(askNext, 1800));
      }
    };
  };
  askNext();
}

/* ---------- Tipptest ---------- */
function viewTipp() {
  stopAll();
  let target = Math.floor(Math.random() * 10), hits = 0, miss = 0, done = false;
  const t0 = performance.now();
  app.innerHTML = `<div class="stage"><div class="timer"><i id="tb"></i></div><div class="secs" id="secs">30</div><div class="note">Tippe die Ziffer, so schnell du kannst</div><div class="target" id="tg">${target}</div><div class="note" id="cnt"></div></div>${padHTML()}`;
  const frame = () => {
    const left = Math.max(0, TIPP_MS - (performance.now() - t0));
    $('#tb').style.transform = 'scaleX(' + (left / TIPP_MS) + ')'; $('#secs').textContent = Math.ceil(left / 1000);
    if (left <= 0) return finish();
    raf = requestAnimationFrame(frame);
  };
  const finish = async () => {
    if (done) return; done = true; stopAll();
    const rate = Math.round(hits * 60000 / TIPP_MS);
    await save({ p_mode: 'tipp', p_set: me.set, p_correct: rate, p_errors: miss, p_attempts: [] });
    me.tap_rate = rate;
    viewHome(`<b>Tipptest: ${rate} Ziffern pro Minute.</b> Dein Ziel in der App ist jetzt ${S.goalApp(me)} richtige Aufgaben pro Minute.`);
  };
  onKey = k => {
    if (done || !/^[0-9]$/.test(k)) return;
    if (+k === target) { hits++; let n; do { n = Math.floor(Math.random() * 10); } while (n === target); target = n; $('#tg').textContent = target; }
    else { miss++; const el = $('#tg'); el.classList.remove('flash-bad'); void el.offsetWidth; el.classList.add('flash-bad'); }
  };
  raf = requestAnimationFrame(frame);
}

window.addEventListener('online', () => { if (token) flushPending(); });
start();
}
</script>
