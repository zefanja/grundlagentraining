server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  # Nur eigene Dateien und die eigene Supabase-Instanz zulassen (Adresse anpassen!)
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://DEIN-PROJEKT.supabase.co wss://DEIN-PROJEKT.supabase.co; frame-ancestors 'none'" always;
  location = /config.js { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ =404; }
}
