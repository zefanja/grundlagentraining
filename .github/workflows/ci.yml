name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: App-Tests (Datenbank + Browser-Simulation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/tests/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Keine Zugangsdaten im Repo
        working-directory: .
        run: |
          if git ls-files | grep -q '^app/web/config.js$'; then
            echo "::error::app/web/config.js darf nicht eingecheckt werden"; exit 1
          fi

  material:
    name: Druckmaterial bauen (PDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: material/requirements.txt
      - name: Schrift installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core
      - run: pip install -r material/requirements.txt
      - run: python material/build.py
      - name: PDFs prüfen
        run: |
          for f in Eingangstest Satzblaetter Sprintblaetter; do
            test -s "material/out/${f}_Grundaufgaben.pdf" || { echo "::error::$f fehlt"; exit 1; }
          done
          ls -la material/out
      - uses: actions/upload-artifact@v4
        with:
          name: druckmaterial
          path: material/out/*.pdf
          retention-days: 90

  pages-build:
    name: GitHub Pages bauen
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Seite mit config.js aus Secrets bauen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SCHUELER_URL: ${{ vars.SCHUELER_URL }}
        run: node app/scripts/build-pages.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pages-deploy:
    name: GitHub Pages veröffentlichen
    needs: [pages-build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Release mit PDFs und App
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, material]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: druckmaterial
          path: dist
      - name: App packen
        run: |
          mkdir -p pkg/sprint-tracker
          cp -r app/supabase app/web app/scripts app/docker-compose.yml app/nginx.conf app/README.md pkg/sprint-tracker/
          (cd pkg && zip -qr ../dist/sprint-tracker-app.zip sprint-tracker)
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
